name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    # 队列集成测试（tests/test_redis_queue.py）和迁移测试（tests/test_migrations.py）连这两个服务；
    # 连不上时那几个测试会跳过
    services:
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 2s --health-timeout 2s --health-retries 15
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: failgate
          POSTGRES_PASSWORD: failgate
          POSTGRES_DB: failgate
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U failgate" --health-interval 2s --health-timeout 2s --health-retries 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: mypy failgate
      - run: pytest -q

  # 整套测试在 PostgreSQL 上再跑一遍（ADR 0024）：每个测试清空 schema、走 Alembic 迁移建表
  test-postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: failgate
          POSTGRES_PASSWORD: failgate
          POSTGRES_DB: failgate
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U failgate" --health-interval 2s --health-timeout 2s --health-retries 15
    env:
      TEST_DATABASE_URL: postgresql+asyncpg://failgate:failgate@127.0.0.1:5432/failgate
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      # 沙箱集成测试和数据库无关，已经在上面的任务里跑过
      - run: pytest -q -m "not docker"

  compose:
    # 一键部署（ADR 0044）：compose 配置能解析、镜像能构建、容器里 failgate 能启动
    runs-on: ubuntu-latest
    env:
      CONSOLE_TOKEN: ci-only
      GITHUB_APP_PRIVATE_KEY_PATH: ./deploy/no-key.txt
    steps:
      - uses: actions/checkout@v7
      - run: touch .env
      - run: docker compose config --quiet
      - run: docker compose build api
      - run: docker run --rm failgate:local failgate --help
      - run: docker run --rm failgate:local docker --version
