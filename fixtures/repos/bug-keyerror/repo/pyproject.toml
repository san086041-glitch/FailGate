[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "confkit"
version = "0.3.0"
description = "A tiny INI-style config parser (RepoWarden fixture)."
requires-python = ">=3.9"

[tool.setuptools]
packages = ["confkit"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers"
filterwarnings = ["error"]
