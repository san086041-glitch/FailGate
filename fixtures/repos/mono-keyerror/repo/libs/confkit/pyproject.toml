[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "confkit"
version = "0.3.0"
description = "A tiny INI-style config parser (FailGate monorepo fixture)."
requires-python = ">=3.9"

[tool.setuptools]
packages = ["confkit"]

[tool.pytest.ini_options]
testpaths = ["tests/unit_tests"]
addopts = "--strict-markers"
markers = ["unit: a marker that only this subdir's config registers"]
filterwarnings = ["error"]
