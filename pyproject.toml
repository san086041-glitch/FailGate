[build-system]
requires = ["hatchling>=1.27", "hatch-fancy-pypi-readme>=25.1"]
build-backend = "hatchling.build"

[project]
name = "failgate"
# 版本号只写在 failgate/__init__.py；PyPI 上的 README 由 fancy-pypi-readme 在构建时生成（见下）
dynamic = ["version", "readme"]
description = "The acceptance layer for bug fixes: seal a failing test, then verify any fix against it"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "san086041-glitch" }]
keywords = ["testing", "pytest", "ai-agents", "code-review", "github-app", "mutation-testing"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Software Development :: Quality Assurance",
  "Topic :: Software Development :: Testing",
]
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "sqlalchemy[asyncio]>=2.0.30",
  "aiosqlite>=0.20",
  "httpx>=0.27",
  "typer>=0.12",
  "pyjwt[crypto]>=2.8",
  "packaging>=23",
  # 考卷强度的变异算子（ADR 0020）；锁版本，只当库用（在宿主机生成变异体）
  "cosmic-ray==8.7.0",
  # 队列与 worker（W6，ADR 0023）：arq 带来 redis-py，Case 锁用 redis-py 的 Lock
  "arq==0.26.3",
  # PostgreSQL 驱动与迁移（ADR 0024）；开发和测试仍可用 SQLite
  "asyncpg==0.30.0",
  "alembic==1.16.5",
  # 链路追踪（ADR 0025）：OTel SDK + OTLP/HTTP 导出（Langfuse 或任何 OTel 后端）
  "opentelemetry-api==1.45.0",
  "opentelemetry-sdk==1.45.0",
  "opentelemetry-exporter-otlp-proto-http==1.45.0",
  # 修复 Agent 的图（M4，ADR 0027）：只用 StateGraph，不引入 langchain 的 Agent 抽象
  "langgraph==1.2.12",
  # 本地 stdio MCP 服务（W10，ADR 0033）：官方 Python SDK 2.x（FastMCP 已改名 MCPServer）
  "mcp==2.2.0",
  # 命令行交互模式（ADR 0036）：补全、历史、底部提示栏
  "prompt_toolkit==3.0.53",
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "pytest-asyncio>=0.23",
  "ruff>=0.5",
  "mypy>=1.10",
  # tests/test_packaging.py 直接调 hatchling 的构建器（离线）检查 sdist / wheel 的成员
  "hatchling>=1.27",
  "hatch-fancy-pypi-readme>=25.1",
]

[project.urls]
Homepage = "https://github.com/san086041-glitch/FailGate"
Repository = "https://github.com/san086041-glitch/FailGate"
Issues = "https://github.com/san086041-glitch/FailGate/issues"
Changelog = "https://github.com/san086041-glitch/FailGate/blob/main/CHANGELOG.md"

[project.scripts]
failgate = "failgate.cli:app"

[tool.hatch.version]
path = "failgate/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["failgate"]
exclude = ["**/__pycache__"]

# sdist 默认带上所有被 git 跟踪的文件：从私有 dev 仓库构建会把 docs/adr、docs/design、eval/reports
# 打进包里上传到 PyPI。白名单是第一道保险；第二道是只从公开镜像构建（release.yml），
# 第三道是 release.yml 里检查成员列表（ADR 0047）
[tool.hatch.build.targets.sdist]
only-include = ["failgate", "README.md", "LICENSE", "CHANGELOG.md", "pyproject.toml"]
exclude = ["**/__pycache__"]

# PyPI 不认相对链接：构建时把 README 里的 docs/… 换成公开仓库的绝对地址（README 本身不改）
[tool.hatch.metadata.hooks.fancy-pypi-readme]
content-type = "text/markdown"

[[tool.hatch.metadata.hooks.fancy-pypi-readme.fragments]]
path = "README.md"

[[tool.hatch.metadata.hooks.fancy-pypi-readme.substitutions]]
# 图片：src="docs/…" → GitHub raw
pattern = 'src="(?!https?://)([^"]+)"'
replacement = 'src="https://raw.githubusercontent.com/san086041-glitch/FailGate/main/\1"'

[[tool.hatch.metadata.hooks.fancy-pypi-readme.substitutions]]
# HTML 链接：href="LICENSE" / href="README.zh-CN.md" → GitHub 页面；锚点不动
pattern = 'href="(?!https?://|#|mailto:)([^"]+)"'
replacement = 'href="https://github.com/san086041-glitch/FailGate/blob/main/\1"'

[[tool.hatch.metadata.hooks.fancy-pypi-readme.substitutions]]
# 链接：](docs/…) / ](README.zh-CN.md) → GitHub 页面；锚点和绝对地址不动
pattern = '\]\((?!https?://|#|mailto:)([^)]+)\)'
replacement = '](https://github.com/san086041-glitch/FailGate/blob/main/\1)'

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
markers = [
  "docker: 真的起容器的沙箱集成测试（没有 Docker 时自动跳过）",
  "redis: 连真实 Redis 的队列集成测试（连不上时自动跳过）",
  "postgres: 连真实 PostgreSQL 的迁移测试（连不上时自动跳过）",
]

[tool.ruff]
line-length = 100
target-version = "py311"
# fixture 仓库是"待复现的外部项目"，bug 是故意的，风格也按 3.9 写，不参与本项目的 lint
extend-exclude = ["fixtures/repos", "failgate/migrations/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC"]

[tool.mypy]
python_version = "3.11"
plugins = ["pydantic.mypy"]
ignore_missing_imports = true
