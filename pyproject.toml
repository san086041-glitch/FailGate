[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "failgate"
version = "0.0.1"
description = "证据驱动的开源仓库值班 Agent"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "sqlalchemy[asyncio]>=2.0.30",
  "aiosqlite>=0.20",
  "httpx>=0.27",
  "typer>=0.12",
  "pyjwt[crypto]>=2.8",
  "packaging>=23",
  # 考卷强度的变异算子（ADR 0020）；锁版本，只当库用（在宿主机生成变异体）
  "cosmic-ray==8.7.0",
  # 队列与 worker（W6，ADR 0023）：arq 带来 redis-py，Case 锁用 redis-py 的 Lock
  "arq==0.26.3",
  # PostgreSQL 驱动与迁移（ADR 0024）；开发和测试仍可用 SQLite
  "asyncpg==0.30.0",
  "alembic==1.16.5",
  # 链路追踪（ADR 0025）：OTel SDK + OTLP/HTTP 导出（Langfuse 或任何 OTel 后端）
  "opentelemetry-api==1.45.0",
  "opentelemetry-sdk==1.45.0",
  "opentelemetry-exporter-otlp-proto-http==1.45.0",
  # 修复 Agent 的图（M4，ADR 0027）：只用 StateGraph，不引入 langchain 的 Agent 抽象
  "langgraph==1.2.12",
  # 本地 stdio MCP 服务（W10，ADR 0033）：官方 Python SDK 2.x（FastMCP 已改名 MCPServer）
  "mcp==2.2.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "pytest-asyncio>=0.23",
  "ruff>=0.5",
  "mypy>=1.10",
]

[project.scripts]
failgate = "failgate.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["failgate"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
markers = [
  "docker: 真的起容器的沙箱集成测试（没有 Docker 时自动跳过）",
  "redis: 连真实 Redis 的队列集成测试（连不上时自动跳过）",
  "postgres: 连真实 PostgreSQL 的迁移测试（连不上时自动跳过）",
]

[tool.ruff]
line-length = 100
target-version = "py311"
# fixture 仓库是"待复现的外部项目"，bug 是故意的，风格也按 3.9 写，不参与本项目的 lint
extend-exclude = ["fixtures/repos", "failgate/migrations/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC"]

[tool.mypy]
python_version = "3.11"
plugins = ["pydantic.mypy"]
ignore_missing_imports = true
