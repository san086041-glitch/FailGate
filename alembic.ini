# Alembic config for developers (ADR 0024). Migration scripts live in the package: failgate/migrations/versions/.
# Keep this file ASCII-only: Alembic reads it with the locale encoding (GBK on a Chinese Windows).
# Example: alembic -x db=postgresql+asyncpg://failgate:failgate@127.0.0.1:5432/failgate revision --autogenerate -m "add xxx"
# Without -x db= it uses FAILGATE_DB_URL from the settings. Deploy with `failgate db upgrade` (the service also upgrades on start).

[alembic]
script_location = failgate/migrations
file_template = %%(year)d%%(month).2d%%(day).2d_%%(rev)s_%%(slug)s
prepend_sys_path = .

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %%(levelname)-5.5s [%%(name)s] %%(message)s
