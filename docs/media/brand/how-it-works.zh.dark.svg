<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="452" viewBox="0 0 1000 452" font-family="Segoe UI, -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', Helvetica, Arial, sans-serif" role="img" aria-label="How FailGate works"><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#9198a1"/></marker><marker id="arrr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#f85149"/></marker></defs><rect width="1000" height="452" rx="16" fill="#0d1117"/><rect x="20" y="40" width="210" height="250" rx="12" fill="#151b23" stroke="#4493f8" stroke-width="1.5"/><text x="40" y="72" font-size="18" font-weight="700" fill="#4493f8" text-anchor="start">① 出题</text><text x="40" y="108" font-size="14" font-weight="400" fill="#f0f6fc" text-anchor="start">Issue → 在 Docker</text><text x="40" y="128" font-size="14" font-weight="400" fill="#f0f6fc" text-anchor="start">沙箱里复现</text><text x="40" y="166" font-size="14" font-weight="400" fill="#f0f6fc" text-anchor="start">Agent 在仓库自己的测试目录</text><text x="40" y="186" font-size="14" font-weight="400" fill="#f0f6fc" text-anchor="start">写一个会失败的测试</text><text x="40" y="224" font-size="13" font-weight="400" fill="#9198a1" text-anchor="start">判定器确认：失败方式就是</text><text x="40" y="243" font-size="13" font-weight="400" fill="#9198a1" text-anchor="start">issue 说的问题（L2 证据）</text><line x1="232" y1="165" x2="262" y2="165" stroke="#9198a1" stroke-width="2" marker-end="url(#arr)"/><rect x="266" y="40" width="170" height="250" rx="12" fill="#151b23" stroke="#ab7df8" stroke-width="1.5"/><text x="286" y="72" font-size="18" font-weight="700" fill="#ab7df8" text-anchor="start">② 封存</text><rect x="286" y="96" width="130" height="56" rx="8" fill="none" stroke="#ab7df8" stroke-dasharray="4 3"/><text x="351" y="121" font-size="14" font-weight="600" fill="#f0f6fc" text-anchor="middle">🔒 test_*.py</text><text x="351" y="141" font-size="12" font-weight="400" fill="#9198a1" text-anchor="middle">sha256: 1c49…</text><text x="286" y="182" font-size="13" font-weight="400" fill="#f0f6fc" text-anchor="start">sha256 + 证据收据</text><text x="286" y="201" font-size="13" font-weight="400" fill="#9198a1" text-anchor="start">只加不改</text><text x="286" y="236" font-size="13" font-weight="400" fill="#f0f6fc" text-anchor="start">核验永远跑</text><text x="286" y="255" font-size="13" font-weight="400" fill="#f0f6fc" text-anchor="start">封存的版本</text><line x1="438" y1="165" x2="468" y2="165" stroke="#9198a1" stroke-width="2" marker-end="url(#arr)"/><rect x="472" y="40" width="330" height="250" rx="12" fill="#151b23" stroke="#3fb950" stroke-width="1.5"/><text x="492" y="72" font-size="18" font-weight="700" fill="#3fb950" text-anchor="start">③ 阅卷：核验任何修复</text><text x="492" y="98" font-size="12" font-weight="400" fill="#9198a1" text-anchor="start">PR 声称 “Fixes #N”——人写的，</text><text x="492" y="116" font-size="12" font-weight="400" fill="#9198a1" text-anchor="start">或 Claude Code、Codex、Copilot、自带的修复 Agent</text><rect x="492" y="136" width="290" height="34" rx="8" fill="#0d1117" stroke="#3d444d"/><circle cx="510" cy="153" r="10" fill="#3fb950"/><text x="510" y="158" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle">1</text><text x="528" y="158" font-size="13" font-weight="400" fill="#f0f6fc" text-anchor="start">封存的测试：修复前失败、修复后通过</text><rect x="492" y="178" width="290" height="34" rx="8" fill="#0d1117" stroke="#3d444d"/><circle cx="510" cy="195" r="10" fill="#3fb950"/><text x="510" y="200" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle">2</text><text x="528" y="200" font-size="13" font-weight="400" fill="#f0f6fc" text-anchor="start">无篡改：删改测试、skip/xfail、conftest</text><rect x="492" y="220" width="290" height="34" rx="8" fill="#0d1117" stroke="#3d444d"/><circle cx="510" cy="237" r="10" fill="#3fb950"/><text x="510" y="242" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle">3</text><text x="528" y="242" font-size="13" font-weight="400" fill="#f0f6fc" text-anchor="start">相关的已有测试没有新增失败</text><text x="492" y="278" font-size="12" font-weight="600" fill="#d29922" text-anchor="start">+ 考卷强度（变异测试）· 隐藏考卷</text><line x1="804" y1="165" x2="834" y2="165" stroke="#9198a1" stroke-width="2" marker-end="url(#arr)"/><rect x="838" y="40" width="142" height="250" rx="12" fill="#151b23" stroke="#3d444d" stroke-width="1.5"/><text x="909" y="72" font-size="18" font-weight="700" fill="#f0f6fc" text-anchor="middle">结论</text><rect x="849" y="92" width="120" height="32" rx="16" fill="#3fb950"/><text x="909" y="113" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">通过验收</text><rect x="849" y="136" width="120" height="32" rx="16" fill="#f85149"/><text x="909" y="157" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">驳回</text><rect x="849" y="180" width="120" height="32" rx="16" fill="#d29922"/><text x="909" y="201" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">无法判定</text><text x="909" y="248" font-size="12" font-weight="400" fill="#9198a1" text-anchor="middle">发到 PR 上</text><text x="909" y="266" font-size="12" font-weight="400" fill="#9198a1" text-anchor="middle">+ 核验收据</text><path d="M909 296 C909 330, 640 330, 640 296" fill="none" stroke="#f85149" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#arrr)"/><text x="774" y="342" font-size="12" font-weight="400" fill="#f85149" text-anchor="middle">驳回 → 理由回传给修复 Agent → 重修（最多 2 轮）</text><rect x="20" y="366" width="960" height="32" rx="8" fill="#151b23" stroke="#3d444d"/><text x="40" y="387" font-size="13" font-weight="700" fill="#9198a1" text-anchor="start">入口</text><text x="160" y="387" font-size="13" font-weight="400" fill="#f0f6fc" text-anchor="start">GitHub App  ·  命令行  ·  MCP（Claude Code、Cursor）</text><rect x="20" y="406" width="960" height="32" rx="8" fill="#151b23" stroke="#3d444d"/><text x="40" y="427" font-size="13" font-weight="700" fill="#9198a1" text-anchor="start">沙箱</text><text x="160" y="427" font-size="13" font-weight="400" fill="#f0f6fc" text-anchor="start">运行时断网 · 安装阶段只能经白名单代理出网</text></svg>
