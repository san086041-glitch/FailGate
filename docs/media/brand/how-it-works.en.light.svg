<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="452" viewBox="0 0 1000 452" font-family="Segoe UI, -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', Helvetica, Arial, sans-serif" role="img" aria-label="How FailGate works"><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#59636e"/></marker><marker id="arrr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#cf222e"/></marker></defs><rect width="1000" height="452" rx="16" fill="#ffffff"/><rect x="20" y="40" width="210" height="250" rx="12" fill="#f6f8fa" stroke="#0969da" stroke-width="1.5"/><text x="40" y="72" font-size="18" font-weight="700" fill="#0969da" text-anchor="start">① Write the exam</text><text x="40" y="108" font-size="14" font-weight="400" fill="#1f2328" text-anchor="start">Issue → reproduce in a</text><text x="40" y="128" font-size="14" font-weight="400" fill="#1f2328" text-anchor="start">Docker sandbox</text><text x="40" y="166" font-size="14" font-weight="400" fill="#1f2328" text-anchor="start">Agent writes a failing test</text><text x="40" y="186" font-size="14" font-weight="400" fill="#1f2328" text-anchor="start">in the repo's own test dir</text><text x="40" y="224" font-size="13" font-weight="400" fill="#59636e" text-anchor="start">Judge: fails the way the</text><text x="40" y="243" font-size="13" font-weight="400" fill="#59636e" text-anchor="start">issue says (L2 evidence)</text><line x1="232" y1="165" x2="262" y2="165" stroke="#59636e" stroke-width="2" marker-end="url(#arr)"/><rect x="266" y="40" width="170" height="250" rx="12" fill="#f6f8fa" stroke="#8250df" stroke-width="1.5"/><text x="286" y="72" font-size="18" font-weight="700" fill="#8250df" text-anchor="start">② Seal it</text><rect x="286" y="96" width="130" height="56" rx="8" fill="none" stroke="#8250df" stroke-dasharray="4 3"/><text x="351" y="121" font-size="14" font-weight="600" fill="#1f2328" text-anchor="middle">🔒 test_*.py</text><text x="351" y="141" font-size="12" font-weight="400" fill="#59636e" text-anchor="middle">sha256: 1c49…</text><text x="286" y="182" font-size="13" font-weight="400" fill="#1f2328" text-anchor="start">sha256 + receipt (JSON)</text><text x="286" y="201" font-size="13" font-weight="400" fill="#59636e" text-anchor="start">append-only store</text><text x="286" y="236" font-size="13" font-weight="400" fill="#1f2328" text-anchor="start">Verification always runs</text><text x="286" y="255" font-size="13" font-weight="400" fill="#1f2328" text-anchor="start">the sealed version</text><line x1="438" y1="165" x2="468" y2="165" stroke="#59636e" stroke-width="2" marker-end="url(#arr)"/><rect x="472" y="40" width="330" height="250" rx="12" fill="#f6f8fa" stroke="#1a7f37" stroke-width="1.5"/><text x="492" y="72" font-size="18" font-weight="700" fill="#1a7f37" text-anchor="start">③ Grade any fix</text><text x="492" y="98" font-size="12" font-weight="400" fill="#59636e" text-anchor="start">PR says “Fixes #N” — from a human,</text><text x="492" y="116" font-size="12" font-weight="400" fill="#59636e" text-anchor="start">Claude Code, Codex, Copilot or FailGate’s own fixer</text><rect x="492" y="136" width="290" height="34" rx="8" fill="#ffffff" stroke="#d1d9e0"/><circle cx="510" cy="153" r="10" fill="#1a7f37"/><text x="510" y="158" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle">1</text><text x="528" y="158" font-size="13" font-weight="400" fill="#1f2328" text-anchor="start">Sealed test fails before, passes after</text><rect x="492" y="178" width="290" height="34" rx="8" fill="#ffffff" stroke="#d1d9e0"/><circle cx="510" cy="195" r="10" fill="#1a7f37"/><text x="510" y="200" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle">2</text><text x="528" y="200" font-size="13" font-weight="400" fill="#1f2328" text-anchor="start">No tampering: edits, skip/xfail, conftest</text><rect x="492" y="220" width="290" height="34" rx="8" fill="#ffffff" stroke="#d1d9e0"/><circle cx="510" cy="237" r="10" fill="#1a7f37"/><text x="510" y="242" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle">3</text><text x="528" y="242" font-size="13" font-weight="400" fill="#1f2328" text-anchor="start">No new failures in related tests</text><text x="492" y="278" font-size="12" font-weight="600" fill="#9a6700" text-anchor="start">+ exam strength (mutation) · hidden exam</text><line x1="804" y1="165" x2="834" y2="165" stroke="#59636e" stroke-width="2" marker-end="url(#arr)"/><rect x="838" y="40" width="142" height="250" rx="12" fill="#f6f8fa" stroke="#d1d9e0" stroke-width="1.5"/><text x="909" y="72" font-size="18" font-weight="700" fill="#1f2328" text-anchor="middle">Verdict</text><rect x="849" y="92" width="120" height="32" rx="16" fill="#1a7f37"/><text x="909" y="113" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">VERIFIED</text><rect x="849" y="136" width="120" height="32" rx="16" fill="#cf222e"/><text x="909" y="157" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">REFUTED</text><rect x="849" y="180" width="120" height="32" rx="16" fill="#9a6700"/><text x="909" y="201" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">INCONCLUSIVE</text><text x="909" y="248" font-size="12" font-weight="400" fill="#59636e" text-anchor="middle">posted on the PR</text><text x="909" y="266" font-size="12" font-weight="400" fill="#59636e" text-anchor="middle">+ hashed receipt</text><path d="M909 296 C909 330, 640 330, 640 296" fill="none" stroke="#cf222e" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#arrr)"/><text x="774" y="342" font-size="12" font-weight="400" fill="#cf222e" text-anchor="middle">refuted → reasons fed back to the fixer → retry (max 2 rounds)</text><rect x="20" y="366" width="960" height="32" rx="8" fill="#f6f8fa" stroke="#d1d9e0"/><text x="40" y="387" font-size="13" font-weight="700" fill="#59636e" text-anchor="start">Entry points</text><text x="160" y="387" font-size="13" font-weight="400" fill="#1f2328" text-anchor="start">GitHub App  ·  CLI  ·  MCP (Claude Code, Cursor)</text><rect x="20" y="406" width="960" height="32" rx="8" fill="#f6f8fa" stroke="#d1d9e0"/><text x="40" y="427" font-size="13" font-weight="700" fill="#59636e" text-anchor="start">Sandbox</text><text x="160" y="427" font-size="13" font-weight="400" fill="#1f2328" text-anchor="start">no network at run time · install via egress allowlist</text></svg>
