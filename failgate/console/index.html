<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FailGate 工作台</title>
<style>
:root{--bg:#f6f7f9;--card:#fff;--ink:#1b1f24;--muted:#5d6672;--line:#e3e6ea;--accent:#2f5bd3;
--ok:#1f7a3d;--okbg:#e6f4ea;--bad:#b42318;--badbg:#fdecea;--warn:#8a5a00;--warnbg:#fff4d6;--chip:#eef1f5;
--mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
@media (prefers-color-scheme:dark){:root{--bg:#0f1216;--card:#171b21;--ink:#e6e8eb;--muted:#9aa4b0;
--line:#2a3038;--accent:#7aa2ff;--ok:#6fd08c;--okbg:#14301f;--bad:#ff8a80;--badbg:#3a1a18;
--warn:#f0c060;--warnbg:#33290f;--chip:#222831}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.55 system-ui,-apple-system,"Segoe UI","Microsoft YaHei",sans-serif}
header{position:sticky;top:0;z-index:2;background:var(--card);border-bottom:1px solid var(--line);
padding:10px 20px;display:flex;gap:16px;align-items:center;flex-wrap:wrap}
header h1{font-size:16px;margin:0}
header a{color:inherit;text-decoration:none}
.stats{display:flex;gap:8px;flex-wrap:wrap}
.chip{background:var(--chip);border-radius:999px;padding:2px 10px;font-size:12px;color:var(--muted)}
.chip b{color:var(--ink)}
main{max-width:1180px;margin:0 auto;padding:18px 20px 60px}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px 16px;margin:0 0 14px}
.card h2{font-size:15px;margin:0 0 10px}
.card h3{font-size:13px;margin:12px 0 6px;color:var(--muted)}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--line);vertical-align:top}
th{color:var(--muted);font-weight:600;font-size:12px}
tr.click{cursor:pointer}
tr.click:hover td{background:var(--chip)}
.mono{font-family:var(--mono);font-size:12px}
.muted{color:var(--muted)}
.badge{display:inline-block;padding:1px 8px;border-radius:6px;font-size:12px;font-weight:600;background:var(--chip)}
.b-ok{background:var(--okbg);color:var(--ok)}
.b-bad{background:var(--badbg);color:var(--bad)}
.b-warn{background:var(--warnbg);color:var(--warn)}
.filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px}
select,input{background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:6px;padding:4px 8px;font:inherit}
pre{background:var(--chip);border-radius:8px;padding:10px;overflow:auto;font-family:var(--mono);font-size:12px;max-height:420px;margin:6px 0}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:12px}
.kv{display:grid;grid-template-columns:120px 1fr;gap:4px 10px;font-size:13px}
.kv div:nth-child(odd){color:var(--muted)}
.timeline{list-style:none;margin:0;padding:0}
.timeline li{padding:4px 0 4px 16px;border-left:2px solid var(--line);margin-left:6px;font-size:13px}
.timeline li .mono{margin-right:8px}
a.link{color:var(--accent)}
.err{color:var(--bad)}
.layers span{margin-right:10px}
</style>
</head>
<body>
<header>
  <h1><a href="#/">FailGate 工作台</a></h1>
  <div class="stats" id="stats"></div>
</header>
<main id="app"><p class="muted">加载中…</p></main>
<script>
"use strict";
// 只读工作台（ADR 0035）。所有外部内容（issue 标题、考卷代码、错误信息）都用 textContent 插入，不拼 HTML。

function h(tag, attrs, ...kids) {
  const el = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs || {})) {
    if (v == null || v === false) continue;
    if (k === "class") el.className = v;
    else if (k.startsWith("on")) el.addEventListener(k.slice(2), v);
    else el.setAttribute(k, v);
  }
  for (const kid of kids.flat()) {
    if (kid == null || kid === false) continue;
    el.append(kid instanceof Node ? kid : document.createTextNode(String(kid)));
  }
  return el;
}

// replaceChildren 会把 null 当成文字 "null"：先过滤掉空的部分
function put(el, ...kids) {
  el.replaceChildren(...kids.flat().filter((k) => k != null && k !== false));
}

async function api(path) {
  const r = await fetch("/api" + path, {credentials: "same-origin"});
  if (!r.ok) throw new Error(r.status + " " + (await r.text()).slice(0, 200));
  return r.json();
}

const short = (s, n = 10) => (s ? String(s).slice(0, n) : "—");
const money = (x) => (x == null ? "—" : "$" + Number(x).toFixed(4));
const when = (iso) => (iso ? iso.replace("T", " ").slice(0, 19) : "—");

function verdictBadge(v) {
  const cls = {VERIFIED: "b-ok", REPRODUCED: "b-ok", REFUTED: "b-bad", NOT_REPRODUCED: "b-bad",
               INCONCLUSIVE: "b-warn", FLAKY: "b-warn", RESEALED: "b-warn"}[v] || "";
  return h("span", {class: "badge " + cls}, v || "无声明");
}

function stateBadge(s) {
  const ok = ["VERIFIED", "REPRODUCED", "ANSWERED", "FIXED", "REFIXED", "RESEALED"];
  const bad = ["REFUTED", "NEED_INFO", "ERROR"];
  const warn = ["INCONCLUSIVE", "DUP_SUSPECTED"];
  const cls = ok.includes(s) ? "b-ok" : bad.includes(s) ? "b-bad" : warn.includes(s) ? "b-warn" : "";
  return h("span", {class: "badge " + cls}, s);
}

function ghLink(c) {
  if (c.platform !== "github" || !c.repo) return null;
  const kind = c.kind === "pull" ? "pull" : "issues";  // Case.kind：issue / pull
  return h("a", {class: "link", href: `https://github.com/${c.repo}/${kind}/${c.number}`,
                 target: "_blank", rel: "noopener noreferrer"}, "在 GitHub 打开 ↗");
}

async function renderStats() {
  try {
    const s = await api("/stats");
    const v = s.verifications || {};
    document.getElementById("stats").replaceChildren(
      h("span", {class: "chip"}, "Case ", h("b", {}, s.cases)),
      h("span", {class: "chip"}, "花费 ", h("b", {}, money(s.spent_usd))),
      h("span", {class: "chip"}, "考卷 L2 ", h("b", {}, (s.evidence || {}).L2 || 0)),
      h("span", {class: "chip"}, "核验 ✅ ", h("b", {}, v.VERIFIED || 0), " ❌ ",
        h("b", {}, v.REFUTED || 0), " ？ ", h("b", {}, v.INCONCLUSIVE || 0)));
    return s;
  } catch (e) {
    document.getElementById("stats").replaceChildren(h("span", {class: "err"}, String(e)));
    return null;
  }
}

async function viewList(app, params) {
  const stats = await renderStats();
  const q = new URLSearchParams(params);
  const cases = await api("/cases?" + q.toString());
  const repoSel = h("select", {onchange: (ev) => go({...params, repo: ev.target.value})},
    h("option", {value: ""}, "全部仓库"),
    ((stats && stats.repos) || []).map((r) =>
      h("option", {value: r.repo, selected: params.repo === r.repo ? "" : null},
        `${r.repo}（${r.mode}）`)));
  const kindSel = h("select", {onchange: (ev) => go({...params, kind: ev.target.value})},
    [["", "issue 和 PR"], ["issue", "只看 issue"], ["pull", "只看 PR"]].map(([v, t]) =>
      h("option", {value: v, selected: (params.kind || "") === v ? "" : null}, t)));
  const stateIn = h("input", {placeholder: "状态（如 VERIFIED）", value: params.state || "",
    onchange: (ev) => go({...params, state: ev.target.value.trim().toUpperCase()})});
  const rows = cases.map((c) => h("tr", {class: "click", onclick: () => (location.hash = `#/case/${c.id}`)},
    h("td", {class: "mono"}, c.id),
    h("td", {}, c.repo, h("span", {class: "muted"}, ` ${c.kind === "pull" ? "PR" : "issue"} #${c.number}`)),
    h("td", {}, c.title || h("span", {class: "muted"}, "（无标题）")),
    h("td", {}, stateBadge(c.state)),
    h("td", {class: "mono"}, money(c.spent_usd)),
    h("td", {class: "mono muted"}, when(c.updated_at))));
  put(app, h("div", {class: "card"},
    h("h2", {}, "Case 队列"),
    h("div", {class: "filters"}, repoSel, kindSel, stateIn),
    cases.length ? h("table", {},
      h("thead", {}, h("tr", {}, ["#", "仓库", "标题", "状态", "花费", "更新时间"].map((t) => h("th", {}, t)))),
      h("tbody", {}, rows)) : h("p", {class: "muted"}, "没有符合条件的 Case")));
}

function go(params) {
  const q = new URLSearchParams(Object.entries(params).filter(([, v]) => v));
  location.hash = "#/?" + q.toString();
}

function evidenceCard(e) {
  return h("div", {class: "card"},
    h("div", {}, h("b", {}, `考卷 ${short(e.id, 12)}`), " ", verdictBadge(e.verdict), " ",
      h("span", {class: "badge"}, e.level), e.superseded_by ? h("span", {class: "badge b-warn"}, " 已被取代") : null),
    h("div", {class: "kv", style: "margin-top:8px"},
      h("div", {}, "考卷路径"), h("div", {class: "mono"}, e.test_path),
      h("div", {}, "test_sha256"), h("div", {class: "mono"}, short(e.test_sha256, 16)),
      h("div", {}, "收据哈希"), h("div", {class: "mono"}, short(e.receipt_sha256, 16)),
      h("div", {}, "源码提交"), h("div", {class: "mono"}, short(e.source_sha, 12)),
      h("div", {}, "Python"), h("div", {}, e.python || "—"),
      h("div", {}, "隐藏考卷"), h("div", {}, e.hidden_exams ? `${e.hidden_exams} 份（题目不公开）` : "没有"),
      h("div", {}, "封存时间"), h("div", {class: "mono"}, when(e.created_at))),
    h("p", {}, h("a", {class: "link", href: `#/evidence/${e.id}`}, "收据和考卷代码 →")));
}

function claimLines(c) {
  const st = c.strength;
  return h("div", {style: "margin:6px 0 0"},
    h("div", {}, `声明修复 #${c.issue} `, verdictBadge(c.verdict),
      c.reasons && c.reasons.length ? h("span", {class: "muted"}, "  " + c.reasons.join("、")) : null),
    h("div", {class: "layers muted"},
      h("span", {}, `① 考卷：${c.layer1 || "—"}`),
      h("span", {}, `② 篡改信号：${c.layer2_signals}`),
      h("span", {}, `③ 相关测试：${c.layer3 || "—"}（新增失败 ${c.new_failures}）`)),
    st ? h("div", {class: "muted"}, `考卷强度：${st.grade}（杀死率 ${st.kill_rate == null ? "—" : Math.round(st.kill_rate * 100) + "%"}，` +
      `杀死 ${st.killed} / 存活 ${st.survived}）`) : null,
    c.hidden ? h("div", {class: "muted"}, `隐藏考卷：${c.hidden.total} 道里 ${c.hidden.failed || 0} 道没通过`) : null);
}

function verificationCard(v) {
  return h("div", {class: "card"},
    h("div", {}, h("b", {}, `核验 PR #${v.pr}`), " ", verdictBadge(v.verdict),
      h("span", {class: "muted mono"}, `  ${short(v.base_sha, 7)} → ${short(v.head_sha, 7)}  ${when(v.created_at)}`)),
    v.claims.map(claimLines),
    h("p", {}, h("a", {class: "link", href: `#/verification/${v.id}`}, "完整核验收据 →")));
}

async function viewCase(app, id) {
  renderStats();
  const c = await api(`/cases/${id}`);
  put(app, 
    h("div", {class: "card"},
      h("h2", {}, `${c.repo} ${c.kind === "pull" ? "PR" : "issue"} #${c.number}：`, c.title || "（无标题）"),
      h("div", {}, stateBadge(c.state), "  ", h("span", {class: "muted"}, `花费 ${money(c.spent_usd)} · 创建 ${when(c.created_at)} · 更新 ${when(c.updated_at)}  `), ghLink(c))),
    c.evidence.length ? h("div", {}, h("h3", {}, "证据（封存的考卷）"), h("div", {class: "grid"}, c.evidence.map(evidenceCard))) : null,
    c.verifications.length ? h("div", {}, h("h3", {}, "核验"), c.verifications.map(verificationCard)) : null,
    h("div", {class: "card"}, h("h2", {}, "状态时间线"),
      h("ul", {class: "timeline"}, c.transitions.map((t) => h("li", {},
        h("span", {class: "mono muted"}, when(t.at)), `${t.from} → `, stateBadge(t.to),
        h("span", {class: "muted"}, `  ${t.event}`))))),
    h("div", {class: "card"}, h("h2", {}, "模块运行"),
      c.runs.length ? h("table", {},
        h("thead", {}, h("tr", {}, ["模块", "模型", "状态", "输入 / 缓存 / 输出 token", "花费", "错误"].map((t) => h("th", {}, t)))),
        h("tbody", {}, c.runs.map((r) => h("tr", {},
          h("td", {}, `${r.skill} v${r.version}`), h("td", {class: "mono"}, r.model || "—"),
          h("td", {}, r.status), h("td", {class: "mono"}, `${r.tokens.in} / ${r.tokens.cached} / ${r.tokens.out}`),
          h("td", {class: "mono"}, money(r.usd)), h("td", {class: "err"}, r.error || "")))))
        : h("p", {class: "muted"}, "没有")),
    h("div", {class: "card"}, h("h2", {}, "对外动作（评论、标签、推送）"),
      c.effects.length ? h("table", {},
        h("thead", {}, h("tr", {}, ["动作", "模式", "状态", "尝试", "错误"].map((t) => h("th", {}, t)))),
        h("tbody", {}, c.effects.map((e) => h("tr", {},
          h("td", {}, e.action), h("td", {}, e.mode), h("td", {}, e.status),
          h("td", {class: "mono"}, e.attempts), h("td", {class: "err"}, e.error || "")))))
        : h("p", {class: "muted"}, "没有")));
}

function integrity(problems) {
  return problems && problems.length
    ? h("p", {class: "err"}, "⚠ 哈希对不上：" + problems.join("；"))
    : h("p", {}, h("span", {class: "badge b-ok"}, "✓ 收据哈希一致"));
}

async function viewEvidence(app, id) {
  renderStats();
  const e = await api(`/evidence/${id}`);
  put(app, h("div", {class: "card"},
    h("h2", {}, `考卷 ${e.id} `, verdictBadge(e.verdict)),
    h("p", {}, h("a", {class: "link", href: `#/case/${e.case_id}`}, "← 回到 Case")),
    integrity(e.problems),
    h("h3", {}, `考卷代码 ${e.test_path}`), h("pre", {}, e.test_code),
    h("h3", {}, "本地复验"), h("pre", {}, `failgate evidence show ${e.id.slice(0, 12)}`),
    h("h3", {}, "隐藏考卷（只显示题数和哈希）"),
    e.hidden_exams.length ? h("ul", {}, e.hidden_exams.map((x) =>
      h("li", {class: "mono"}, `${x.id.slice(0, 12)}：${x.tests} 道题，sha256 ${short(x.test_sha256, 16)}，${when(x.created_at)}`)))
      : h("p", {class: "muted"}, "没有"),
    h("h3", {}, "证据收据"), h("pre", {}, JSON.stringify(e.receipt, null, 2))));
}

async function viewVerification(app, id) {
  renderStats();
  const v = await api(`/verifications/${id}`);
  put(app, h("div", {class: "card"},
    h("h2", {}, `核验 PR #${v.pr} `, verdictBadge(v.verdict)),
    h("p", {}, h("a", {class: "link", href: `#/case/${v.case_id}`}, "← 回到 Case")),
    integrity(v.problems),
    h("h3", {}, "核验收据"), h("pre", {}, JSON.stringify(v.receipt, null, 2))));
}

async function route() {
  const app = document.getElementById("app");
  const [path, query] = (location.hash.slice(1) || "/").split("?");
  const parts = path.split("/").filter(Boolean);
  try {
    if (parts[0] === "case") await viewCase(app, encodeURIComponent(parts[1]));
    else if (parts[0] === "evidence") await viewEvidence(app, encodeURIComponent(parts[1]));
    else if (parts[0] === "verification") await viewVerification(app, encodeURIComponent(parts[1]));
    else await viewList(app, Object.fromEntries(new URLSearchParams(query || "")));
    window.scrollTo(0, 0);
  } catch (e) {
    put(app, h("div", {class: "card"}, h("p", {class: "err"}, "出错了：" + e.message),
      h("p", {}, h("a", {class: "link", href: "#/"}, "回到列表"))));
  }
}

window.addEventListener("hashchange", route);
route();
</script>
</body>
</html>
